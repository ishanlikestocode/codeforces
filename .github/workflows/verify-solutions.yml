name: Verify Solutions

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up GCC (C++)
      run: sudo apt-get update && sudo apt-get install -y g++

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Test C++ Solutions Compilation
      run: |
        shopt -s globstar nullglob
        for file in **/*.cpp **/*.cc; do
          if [[ -f "$file" ]]; then
            echo "Checking $file..."
            g++ -O2 -std=c++20 "$file" -o /tmp/sol.out || exit 1
          fi
        done

    - name: Test Python Solutions Syntax
      run: |
        shopt -s globstar nullglob
        for file in **/*.py; do
          if [[ -f "$file" && "$file" != "watch_accepted.py" ]]; then
            echo "Checking syntax: $file..."
            python -m py_compile "$file" || exit 1
          fi
        done
